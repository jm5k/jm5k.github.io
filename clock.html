<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="lcl.css" />

    <title>24-Hour Linear Clock | Minimal</title>

    <!-- 🔍 SEO -->
    <meta
      name="description"
      content="Minimal 24-hour linear clock by jm5k — orientation & direction controls with 12/24-hour labels."
    />
    <meta
      name="keywords"
      content="linear clock, minimal clock, 24 hour clock, vertical clock, horizontal clock, timeline clock, jm5k, linearclocklab, time visualization"
    />
    <meta name="author" content="jm5k" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://linearclocklab.com/clock.html" />

    <!-- 🔗 Social / Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="24-Hour Linear Clock | Linear Clock Lab"
    />
    <meta
      property="og:description"
      content="Experience time as a single elegant line — with orientation, direction, and 12/24-hour labeling."
    />
    <meta property="og:url" content="https://linearclocklab.com/clock.html" />
    <meta
      property="og:image"
      content="https://linearclocklab.com/profile.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="24-Hour Linear Clock | Linear Clock Lab"
    />
    <meta
      name="twitter:description"
      content="Experience time as a single elegant line — minimalist and clear."
    />
    <meta
      name="twitter:image"
      content="https://linearclocklab.com/profile.png"
    />

    <!-- 🔖 Favicon / Icons -->
    <link
      rel="icon"
      href="https://linearclocklab.com/profile.png"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="https://linearclocklab.com/profile.png"
    />

    <style>
      :root {
        --bg: #000;
        --fg: #e0e0e0;
        --muted: #9aa0a6;
        --accent: #0ff;
        --rail: #0b0b0b;
        --rail-border: #555;
        --tick-q: #ffffff1a;
        --tick-h: #ffffff4d;
        --label: #888;
        --workhour: #ffea00;
        --stats: #9cf;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
        text-align: center;
        padding: clamp(28px, 5vh, 56px) 0 0;
      }
      a,
      a:visited,
      a:hover,
      a:active {
        color: var(--accent);
        text-decoration: none;
      }

      .wrap {
        width: min(1000px, 92vw);
        padding: 0 20px 36px;
        margin: 0 auto;
      }

      /* Time readout */
      #currentTimeTop {
        color: var(--accent);
        font-size: 1.8rem;
        margin-bottom: 8px;
      }
      #julianDate {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 8px;
      }

      /* Cluster holds rail + labels; switches layout by orientation */
      .railCluster {
        display: grid;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .railCluster.horizontal {
        grid-template-columns: 1fr;
        grid-template-areas: "rail" "labels";
      }
      .railCluster.vertical {
        grid-template-columns: auto 64px;
        grid-template-areas: "rail labels";
        column-gap: 14px;
      }

      /* Plain gray rail */
      #bar {
        position: relative;
        background: var(--rail);
        border: 2px solid var(--rail-border);
        border-radius: 6px;
        overflow: hidden;
        grid-area: rail;
        margin: 0 auto;
      }
      .horizontal #bar {
        width: 95%;
        height: 60px;
      }
      .vertical #bar {
        width: 60px;
        height: min(70vh, 640px);
      }

      #ticks {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .tick {
        position: absolute;
      }

      /* Horizontal ticks */
      .tick-h.qtr {
        top: 0;
        height: 100%;
        width: 1px;
        background: var(--tick-q);
      }
      .tick-h.hour {
        top: 0;
        height: 100%;
        width: 2px;
        background: var(--tick-h);
      }

      /* Vertical ticks */
      .tick-v.qtr {
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--tick-q);
      }
      .tick-v.hour {
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--tick-h);
      }

      /* Cyan time marker */
      #marker {
        position: absolute;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .marker-h {
        width: 4px;
        height: 100%;
        top: 0;
      }
      .marker-v {
        height: 4px;
        width: 100%;
        left: 0;
      }

      /* Labels */
      #hourLabels {
        grid-area: labels;
      }
      .labelRow {
        display: flex;
        justify-content: space-between;
        width: 95%;
        margin: 8px auto 6px;
        font-size: 0.9em;
        color: var(--label);
      }
      .labelCol {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: min(70vh, 640px);
        margin: 0;
        font-size: 0.9em;
        color: var(--label);
        text-align: left;
      }
      .workhour {
        color: var(--workhour);
      }

      #statsBottom {
        color: var(--stats);
        margin-top: 6px;
        font-size: 1.05em;
      }

      /* 12/24 switch */
      #controlsMain {
        margin: 16px 0 10px;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        color: #9cf;
        user-select: none;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: relative;
        width: 44px;
        height: 24px;
        background: #333;
        border: 1px solid #555;
        border-radius: 999px;
        transition: background 0.2s, border-color 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        background: #bbb;
        border-radius: 50%;
        transition: left 0.18s, background 0.2s;
      }
      .switch input:checked + .slider {
        background: #0b3a3a;
        border-color: #0aa;
      }
      .switch input:checked + .slider::before {
        left: 23px;
        background: #0ff;
      }
      .switch-label {
        font-size: 0.95em;
        color: #9cf;
      }

      /* Compact utility actions */
      .utilityActions {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 0.5rem;
        width: min(1000px, 92vw);
        margin: 18px auto 0;
      }
      details {
        margin: 0;
      }
      summary {
        box-sizing: border-box;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        cursor: pointer;
        list-style: none;
        user-select: none;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: var(--muted);
        transition: color 0.2s ease, border-color 0.2s ease,
          background 0.2s ease;
      }
      summary:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.04);
      }
      summary:focus-visible,
      .returnnav a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      summary::marker,
      summary::-webkit-details-marker {
        display: none;
      }
      .panel {
        position: absolute;
        top: calc(38px + 0.5rem);
        left: 50%;
        z-index: 1;
        display: grid;
        gap: 10px;
        width: min(500px, 92vw);
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        box-sizing: border-box;
        padding: 10px 12px 14px;
        border: 1px solid #111;
        border-radius: 6px;
        background: #0a0a0a;
        color: var(--muted);
        text-align: left;
        transform: translateX(-50%);
      }
      details[open] {
        padding-bottom: 168px;
      }
      @media (min-width: 520px) {
        details[open] {
          padding-bottom: 100px;
        }
      }
      .panel label {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      select {
        background: #0f0f10;
        color: var(--fg);
        border: 1px solid #1a1a1a;
        border-radius: 8px;
        padding: 8px 10px;
        font-family: inherit;
        outline: none;
      }

      /* Return link */
      .returnnav {
        margin: 0;
      }
      .returnnav a {
        box-sizing: border-box;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        color: var(--muted);
        text-decoration: none;
        font-size: 1.1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 0;
        transition: color 0.2s ease, border-color 0.2s ease,
          background 0.2s ease;
      }
      .returnnav a:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--accent);
        color: var(--accent);
      }

      footer {
        margin-top: 14px;
        color: #777;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="currentTimeTop">--:--</div>
      <div
        id="julianDate"
        aria-label="Julian date in ordinal YYYY-DDD format"
      >
        Julian date: ---- ---
      </div>

      <!-- Rail + labels cluster -->
      <div id="cluster" class="railCluster horizontal">
        <div id="bar" aria-label="24-hour time rail">
          <div id="ticks" aria-hidden="true"></div>
          <div
            id="marker"
            class="marker-h"
            role="presentation"
            aria-hidden="true"
          ></div>
        </div>
        <div id="hourLabels" class="labelRow"></div>
      </div>

      <div id="statsBottom"></div>

      <!-- 12/24-hour toggle (kept mid-page) -->
      <div id="controlsMain">
        <label class="switch" title="Switch between 12h and 24h">
          <input
            id="formatToggle"
            type="checkbox"
            aria-label="Toggle 24-hour time"
          />
          <span class="slider"></span>
          <span id="formatLabel" class="switch-label">24-hour</span>
        </label>
      </div>

      <div class="utilityActions">
        <details id="customize">
          <summary aria-label="Customize clock" title="Customize clock">⚙</summary>
          <div class="panel">
            <label
              >Orientation
              <select id="orientation">
                <option value="horizontal">Horizontal</option>
                <option value="vertical">Vertical</option>
              </select>
            </label>
            <label
              >Direction
              <select id="direction">
                <option value="forward">Forward (start → end)</option>
                <option value="backward">Backward (end → start)</option>
              </select>
            </label>
          </div>
        </details>

        <nav class="returnnav" aria-label="Return">
          <a
            href="index.html"
            aria-label="Back to Linear Clock Lab"
            title="Back to Linear Clock Lab"
            >&larr;</a>
        </nav>
      </div>
      <footer>
        <p>© 2025–2026 <strong>jm5k</strong></p>
      </footer>
    </div>

    <script>
      /* ===== Persistence ===== */
      const LS = { use24h: "use24h", prefs: "clock.prefs.v3" };
      let use24h = JSON.parse(localStorage.getItem(LS.use24h) ?? "true");
      let prefs = { orientation: "horizontal", direction: "forward" };
      try {
        prefs = {
          ...prefs,
          ...(JSON.parse(localStorage.getItem(LS.prefs)) || {}),
        };
      } catch {}

      /* ===== Elements ===== */
      const cluster = document.getElementById("cluster");
      const bar = document.getElementById("bar");
      const ticks = document.getElementById("ticks");
      const marker = document.getElementById("marker");
      const labels = document.getElementById("hourLabels");
      const current = document.getElementById("currentTimeTop");
      const julianDate = document.getElementById("julianDate");
      const stats = document.getElementById("statsBottom");

      const orientationSel = document.getElementById("orientation");
      const directionSel = document.getElementById("direction");
      orientationSel.value = prefs.orientation;
      directionSel.value = prefs.direction;

      /* ===== Formatting ===== */
      function formatHourLabel(h24) {
        if (use24h) return String(h24).padStart(2, "0");
        const base = h24 % 12 || 12;
        return String(base).padStart(2, "0");
      }
      function fmtHMS(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const hh = String(Math.floor(s / 3600)).padStart(2, "0");
        const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }
      function formatClockTime(hours, minutes) {
        if (use24h)
          return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(
            2,
            "0"
          )}`;
        let h = hours % 12;
        if (h === 0) h = 12;
        return `${String(h).padStart(2, "0")}:${String(minutes).padStart(
          2,
          "0"
        )} ${hours >= 12 ? "PM" : "AM"}`;
      }
      function formatJulianDate(date) {
        const year = date.getFullYear();
        const dayOfYear =
          Math.floor(
            (Date.UTC(year, date.getMonth(), date.getDate()) -
              Date.UTC(year, 0, 1)) /
              86400000
          ) + 1;
        return `${year}-${String(dayOfYear).padStart(3, "0")}`;
      }

      /* ===== Ticks & Labels ===== */
      function buildTicks() {
        ticks.innerHTML = "";
        const vertical = prefs.orientation === "vertical";
        for (let h = 0; h < 24; h++) {
          for (let q = 0; q < 4; q++) {
            const pos = ((h + q / 4) / 24) * 100;
            const d = document.createElement("div");
            if (vertical) {
              d.className = "tick tick-v " + (q === 0 ? "hour" : "qtr");
              d.style.top = `calc(${pos}% - ${q === 0 ? 1 : 0.5}px)`;
            } else {
              d.className = "tick tick-h " + (q === 0 ? "hour" : "qtr");
              d.style.left = `calc(${pos}% - ${q === 0 ? 1 : 0.5}px)`;
            }
            ticks.appendChild(d);
          }
        }
      }
      function renderLabels() {
        const vertical = prefs.orientation === "vertical";
        labels.className = vertical ? "labelCol" : "labelRow";
        labels.innerHTML = "";
        for (let h = 0; h <= 24; h++) {
          const span = document.createElement("span");
          span.textContent = formatHourLabel(h);
          if (h >= 8 && h <= 17) span.classList.add("workhour");
          labels.appendChild(span);
        }
      }

      /* ===== Marker sizing fix ===== */
      function setMarkerForOrientation() {
        if (prefs.orientation === "vertical") {
          marker.classList.remove("marker-h");
          marker.classList.add("marker-v");
          marker.style.width = "100%";
          marker.style.height = "4px";
          marker.style.left = "0";
          marker.style.top = ""; // set in updateClock
        } else {
          marker.classList.remove("marker-v");
          marker.classList.add("marker-h");
          marker.style.width = "4px";
          marker.style.height = "100%";
          marker.style.top = "0";
          marker.style.left = ""; // set in updateClock
        }
      }

      /* ===== Layout Switch ===== */
      function applyLayout() {
        const vertical = prefs.orientation === "vertical";
        cluster.classList.toggle("vertical", vertical);
        cluster.classList.toggle("horizontal", !vertical);

        setMarkerForOrientation();
        buildTicks();
        renderLabels();
        updateClock();
      }

      /* ===== Clock Update ===== */
      function updateClock() {
        const now = new Date();
        const h = now.getHours(),
          m = now.getMinutes(),
          s = now.getSeconds();
        const secondsSinceMidnight = h * 3600 + m * 60 + s;
        const secondsPerDay = 86400;
        const frac = secondsSinceMidnight / secondsPerDay;
        const forward = prefs.direction === "forward";
        const progress = forward ? frac : 1 - frac;

        if (prefs.orientation === "vertical") {
          marker.style.left = "0";
          marker.style.top = `calc(${progress * 100}% - 2px)`;
        } else {
          marker.style.top = "0";
          marker.style.left = `calc(${progress * 100}% - 2px)`;
        }

        current.textContent = formatClockTime(h, m);
        julianDate.textContent = `Julian date: ${formatJulianDate(now)}`;
        const pct = frac * 100;
        const remaining = secondsPerDay - secondsSinceMidnight;
        stats.textContent = `${pct.toFixed(2)}% of day elapsed | ${fmtHMS(
          remaining
        )} remaining`;
      }

      /* ===== Init ===== */
      applyLayout();
      updateClock();
      setInterval(updateClock, 1000);

      /* ===== 12/24 Toggle ===== */
      const toggle = document.getElementById("formatToggle");
      const label = document.getElementById("formatLabel");
      toggle.checked = use24h;
      label.textContent = use24h ? "24-hour" : "12-hour";
      toggle.addEventListener("change", () => {
        use24h = toggle.checked;
        localStorage.setItem(LS.use24h, JSON.stringify(use24h));
        label.textContent = use24h ? "24-hour" : "12-hour";
        renderLabels();
        updateClock();
      });

      /* ===== Customizer events ===== */
      function savePrefs() {
        localStorage.setItem(LS.prefs, JSON.stringify(prefs));
      }
      const orientationSelEl = document.getElementById("orientation");
      const directionSelEl = document.getElementById("direction");

      orientationSelEl.addEventListener("change", () => {
        prefs.orientation = orientationSelEl.value;
        savePrefs();
        applyLayout();
      });
      directionSelEl.addEventListener("change", () => {
        prefs.direction = directionSelEl.value;
        savePrefs();
        updateClock();
      });
    </script>
  </body>
</html>
